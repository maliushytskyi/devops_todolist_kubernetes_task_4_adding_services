apiVersion: v1
kind: Service
metadata:
  name: todoapp-nodeport
  namespace: todoapp
spec:
  type: NodePort             # відкриває порт на кожній ноді кластера
  selector:
    app: todolist
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30007        # допустимий діапазон 30000-32767