apiVersion: v1
kind: Pod
metadata:
  name: todoapp-1
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: <username>/todoapp:3.0.0
    ports:
    - containerPort: 8080
    env:
    - name: SECRET_KEY
      value: "change-me-in-real-life"
    - name: DEBUG
      value: "False"
    - name: ALLOWED_HOSTS
      value: "*"
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
---
