apiVersion: v1
kind: Service
metadata:
  name: todoapp-clusterip
  namespace: todoapp
spec:
  type: ClusterIP            # доступний лише всередині кластера (тип за замовчуванням)
  selector:
    app: todolist            # балансує між усіма подами з цим лейблом (обидва)
  ports:
    - port: 80               # порт сервісу
      targetPort: 8000       # порт контейнера